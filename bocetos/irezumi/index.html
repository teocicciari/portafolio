<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Irezumi - Tatuajes & Piercing</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Bebas+Neue&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --dark-red: #600011;
            --red: #ba1203;
            --bright-red: #e01d2e;
            --yellow: #fdc928;
        }

        body {
            font-family: 'Noto Sans JP', 'Arial', sans-serif;
            background: linear-gradient(135deg, var(--dark-red) 0%, #000 100%);
            color: white;
            overflow-x: hidden;
        }

        /* Hero Section */
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            background: url('background.jpg') no-repeat center center/cover;
            position: relative;
        }

        .hero::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.8);
            z-index: 0;
        }
        .hero > div {
            position: relative;
            z-index: 1;
        }

        .logo {
            width: 200px;
            height: 200px;
            margin: 0 auto 2rem;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--yellow), var(--bright-red));
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            animation: glow 3s ease-in-out infinite alternate;
            box-shadow: 0 0 50px rgba(253, 201, 40, 0.5);
        }

        .logo img {
            width: 190px;
            height: 190px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid white;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        @keyframes glow {
            from { box-shadow: 0 0 50px rgba(253, 201, 40, 0.5); }
            to { box-shadow: 0 0 80px rgba(253, 201, 40, 0.8), 0 0 120px rgba(224, 29, 46, 0.4); }
        }

        .hero h1 {
            font-family: 'Bebas Neue', 'Noto Sans JP', cursive;
            font-size: 4.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, var(--yellow), var(--bright-red));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(253, 201, 40, 0.5);
            letter-spacing: 3px;
        }

        .hero p {
            font-family: 'Cinzel', 'Noto Sans JP', serif;
            font-size: 1.6rem;
            margin-bottom: 2rem;
            color: #ccc;
            font-weight: 400;
            letter-spacing: 1px;
        }

        .cta-button {
            font-family: 'Cinzel', 'Noto Sans JP', serif;
            background: linear-gradient(45deg, var(--red), var(--bright-red));
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(224, 29, 46, 0.3);
            border: 2px solid var(--yellow);
            margin-top: 20px;
            letter-spacing: 1px;
        }

        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(224, 29, 46, 0.5);
            background: linear-gradient(45deg, var(--bright-red), var(--yellow));
        }

        /* Navigation */
        .nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(96, 0, 17, 0.9);
            backdrop-filter: blur(10px);
            z-index: 1000;
            padding: 1rem 0;
            transition: all 0.3s ease;
        }

        .nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 2rem;
        }

        .nav a {
            font-family: 'Cinzel', 'Noto Sans JP', serif;
            color: white;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
            position: relative;
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        .nav a:hover {
            color: var(--yellow);
        }

        .nav a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--yellow);
            transition: width 0.3s ease;
        }

        .nav a:hover::after {
            width: 100%;
        }

        /* Gallery Section */
        .gallery {
            padding: 5rem 2rem;
            background: linear-gradient(180deg, var(--dark-red) 0%, rgba(0, 0, 0, 0.9) 100%);
        }

        .gallery h2 {
            font-family: 'Bebas Neue', 'Noto Sans JP', cursive;
            text-align: center;
            font-size: 3.5rem;
            margin-bottom: 3rem;
            color: var(--yellow);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
            letter-spacing: 2px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .gallery-item {
            position: relative;
            aspect-ratio: 1;
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(45deg, var(--red), var(--bright-red));
            padding: 3px;
        }

        .gallery-item:hover {
            transform: scale(1.05) rotate(1deg);
            box-shadow: 0 20px 40px rgba(224, 29, 46, 0.4);
        }

        .gallery-placeholder {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--dark-red), var(--red));
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--yellow);
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 17px;
            position: relative;
            font-family: 'Cinzel', 'Noto Sans JP', serif;
        }

        .gallery-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 15px;
            transition: transform 0.3s ease;
        }

        /* Contact Section */
        .contact {
            padding: 5rem 2rem;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.9) 0%, var(--dark-red) 100%);
        }

        .contact h2 {
            font-family: 'Bebas Neue', 'Noto Sans JP', cursive;
            text-align: center;
            font-size: 3.5rem;
            margin-bottom: 3rem;
            color: var(--yellow);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
            letter-spacing: 2px;
        }

        .contact-content {
            max-width: 800px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 3rem;
        }

        .contact-info {
            background: rgba(96, 0, 17, 0.5);
            padding: 2rem;
            border-radius: 20px;
            border: 2px solid var(--yellow);
            backdrop-filter: blur(10px);
        }

        .contact-info h3 {
            font-family: 'Cinzel', 'Noto Sans JP', serif;
            color: var(--yellow);
            font-size: 1.6rem;
            margin-bottom: 1rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .contact-info p {
            font-family: 'Noto Sans JP', sans-serif;
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }

        .contact-form {
            background: rgba(96, 0, 17, 0.5);
            padding: 2rem;
            border-radius: 20px;
            border: 2px solid var(--yellow);
            backdrop-filter: blur(10px);
        }

        .contact-form h3 {
            font-family: 'Cinzel', 'Noto Sans JP', serif;
            color: var(--yellow);
            font-size: 1.6rem;
            margin-bottom: 1rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            font-family: 'Cinzel', 'Noto Sans JP', serif;
            display: block;
            margin-bottom: 0.5rem;
            color: var(--yellow);
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            font-family: 'Noto Sans JP', sans-serif;
            width: 100%;
            padding: 12px;
            border: 2px solid var(--red);
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            font-size: 1rem;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--yellow);
            box-shadow: 0 0 10px rgba(253, 201, 40, 0.3);
        }

        .submit-btn {
            font-family: 'Cinzel', 'Noto Sans JP', serif;
            background: linear-gradient(45deg, var(--red), var(--bright-red));
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            border: 2px solid var(--yellow);
            letter-spacing: 1px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(224, 29, 46, 0.4);
            background: linear-gradient(45deg, var(--bright-red), var(--yellow));
        }

        /* Footer */
        .footer {
            background: var(--dark-red);
            text-align: center;
            padding: 2rem;
            border-top: 3px solid var(--yellow);
        }

        .footer p {
            font-family: 'Noto Sans JP', sans-serif;
            color: #ccc;
            font-size: 0.9rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 3rem;
            }

            .hero p {
                font-size: 1.3rem;
            }

            .gallery h2,
            .contact h2 {
                font-size: 2.5rem;
            }

            .nav ul {
                gap: 1rem;
            }

            .nav a {
                font-size: 1rem;
            }

            .contact-content {
                grid-template-columns: 1fr;
            }
        }

        /* Scroll animations */
        .fade-in {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.6s ease;
        }

        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="nav">
        <ul>
            <li><a href="#home">Inicio</a></li>
            <li><a href="#gallery">Galería</a></li>
            <li><a href="#contact">Contacto</a></li>
        </ul>
    </nav>

    <!-- Hero Section -->
    <section id="home" class="hero">
        <div>
            <div class="logo">
                <img src="logo.jpeg" alt="">
            </div>
            <p>Tatuajes & Piercing - Arte Japonés</p>
            <a href="#gallery" class="cta-button">Ver Nuestro Arte</a>
        </div>
    </section>

    <!-- Gallery Section -->
    <section id="gallery" class="gallery">
        <h2 class="fade-in">Galería de Trabajos</h2>
        <div class="gallery-grid">
            <div class="gallery-item fade-in">
                <div class="gallery-placeholder">
                    <img src="2.png" alt="">
                </div>
            </div>
            <div class="gallery-item fade-in">
                <div class="gallery-placeholder">
                    <img src="3.png" alt="">
                </div>
            </div>
            <div class="gallery-item fade-in">
                <div class="gallery-placeholder">
                    <img src="4.png" alt="">
                </div>
            </div>
            <div class="gallery-item fade-in">
                <div class="gallery-placeholder">
                    <img src="5.png" alt="">
                </div>
            </div>
            <div class="gallery-item fade-in">
                <div class="gallery-placeholder">
                    <img src="6.png" alt="">
                </div>
            </div>
            <div class="gallery-item fade-in">
                <div class="gallery-placeholder">
                    <img src="7.png" alt="">
                </div>
            </div>
        </div>
    </section>

    <!-- Contact Section -->
    <section id="contact" class="contact">
        <h2 class="fade-in">Contacto</h2>
        <div class="contact-content">
            <div class="contact-form fade-in">
                <h3>Reserva tu Cita</h3><br>
                <form>
                    <div class="form-group">
                        <label for="name">Nombre:</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Teléfono:</label>
                        <input type="tel" id="phone" name="phone">
                    </div>
                    <div class="form-group">
                        <label for="service">Servicio:</label>
                        <select id="service" name="service">
                            <option value="tatuaje">Tatuaje</option>
                            <option value="piercing">Piercing</option>
                            <option value="consulta">Consulta</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="message">Descripción del proyecto:</label>
                        <textarea id="message" name="message" rows="4" placeholder="Cuéntanos sobre tu idea..."></textarea>
                    </div>
                    <button type="submit" class="submit-btn">Enviar Consulta</button>
                </form>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2025 Irezumi Tatuajes & Piercing. Todos los derechos reservados.</p>
    </footer>

    <script>
        // Smooth scrolling
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                document.querySelector(this.getAttribute('href')).scrollIntoView({
                    behavior: 'smooth'
                });
            });
        });

        // Scroll animations
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, observerOptions);

        document.querySelectorAll('.fade-in').forEach(el => {
            observer.observe(el);
        });

        // Gallery item click handler
        document.querySelectorAll('.gallery-item').forEach(item => {
            item.addEventListener('click', function() {
                // Add click animation
                this.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    this.style.transform = '';
                }, 150);
            });
        });

        // Form submission
        document.querySelector('form').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('¡Gracias por tu consulta! Te contactaremos pronto para coordinar tu cita.');
            this.reset();
        });

        // Navigation background on scroll
        window.addEventListener('scroll', function() {
            const nav = document.querySelector('.nav');
            if (window.scrollY > 100) {
                nav.style.background = 'rgba(96, 0, 17, 0.95)';
            } else {
                nav.style.background = 'rgba(96, 0, 17, 0.9)';
            }
        });
    </script>
</body>
</html>
